[project]
name = "codepilot"
version = "0.1.0"
description = "Three AI agents (Planner, Architect, Coder) that turn an idea into a working web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.50.0",
    "langgraph==1.0.1",
    "langchain-core==1.0.1",
    "langchain-groq==1.0.0",
    "groq==0.33.0",
    "pydantic==2.12.3",
    "python-dotenv==1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
